name: Relevé MyUEFN

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['maps.json', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer web-push
        run: npm install --no-save --no-package-lock web-push@3.6.7
      - name: Relevé Epic et notification
        env:
          MYUEFN_PUSH: ${{ secrets.MYUEFN_PUSH }}
        run: |
          cat > releve.mjs <<'EOF_SCRIPT'
          import { readFileSync, writeFileSync } from 'node:fs';

          const API = 'https://api.fortnite.com/ecosystem/v1/islands/';
          const RATE = 0.000688, KEEP_DAYS = 40, TZ = 'Europe/Paris';
          const now = new Date();
          const iso = d => new Date(d).toISOString();
          const floorHour = d => { const x = new Date(d); x.setUTCMinutes(0, 0, 0); return x; };
          const floor10 = d => { const x = new Date(d); x.setUTCMinutes(Math.floor(x.getUTCMinutes() / 10) * 10, 0, 0); return x; };
          const readJSON = (p, fb) => { try { return JSON.parse(readFileSync(p, 'utf8')); } catch { return fb; } };
          const num = v => typeof v === 'number' && Number.isFinite(v) ? v : null;
          const hmFmt = new Intl.DateTimeFormat('fr-FR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
          const hm = t => hmFmt.format(new Date(t));
          const fmt = (v, d = 0) => new Intl.NumberFormat('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
          const series = (j, k) => Array.isArray(j?.[k]) ? j[k] : Array.isArray(j?.[k]?.intervals) ? j[k].intervals : [];

          async function getJSON(url) {
            const r = await fetch(url, { headers: { accept: 'application/json' } });
            console.log(r.status, url.replace(API, ''));
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          }

          const maps = readJSON('maps.json', []).filter(m => m && /^\d{4}-\d{4}-\d{4}$/.test(String(m.code)));
          const data = readJSON('data.json', {});
          const byCode = data.byCode || {};
          let events = Array.isArray(data.events) ? data.events : [];
          const at = now.toISOString().replace(/\.\d+Z$/, 'Z');
          const H = new Date(floorHour(now) - 36e5);
          const lines = [];
          const K = { m: 'minutesPlayed', u: 'uniquePlayers', c: 'peakCCU', pl: 'plays', a: 'averageMinutesPerPlayer' };

          for (const map of maps) {
            const name = map.name || map.code;
            const prev = byCode[map.code] || { hours: [], live: null };
            const hours = new Map((prev.hours || []).map(h => [h.t, h]));
            const seeded = hours.size > 0;

            try {
              let j = null;
              if (!seeded) {
                try { j = await getJSON(`${API}${map.code}/metrics/hour?from=${iso(floorHour(now) - 7 * 864e5)}`); }
                catch (e) { console.log('7 jours refusés, on prend 26 h'); }
              }
              if (!j) j = await getJSON(`${API}${map.code}/metrics/hour?from=${iso(floorHour(now) - 26 * 36e5)}`);
              const rows = new Map();
              for (const [k, key] of Object.entries(K)) for (const e of series(j, key)) {
                if (!e || typeof e.timestamp !== 'string') continue;
                const r = rows.get(e.timestamp) || { t: e.timestamp, m: null, u: null, c: null, pl: null, a: null };
                r[k] = num(e.value);
                rows.set(e.timestamp, r);
              }
              if (!rows.size) console.log('réponse inattendue :', JSON.stringify(j).slice(0, 300));
              const fresh = [];
              for (const r of rows.values()) {
                if (!Object.keys(K).some(k => r[k] != null)) continue;
                const old = hours.get(r.t);
                if (r.m != null && (!old || old.m == null)) fresh.push(r);
                hours.set(r.t, r);
              }
              fresh.sort((a, b) => a.t < b.t ? -1 : 1);
              for (const r of seeded ? fresh : fresh.slice(-1)) events.push({ at, code: map.code, k: 'rev', t: r.t, m: r.m });
            } catch (e) { console.log('heures', map.code, e.message); }

            let live = prev.live || null, iv = [];
            try {
              const t = now.toISOString().slice(11, 16).replace(':', '');
              const j = await getJSON(`${API}${map.code}/metrics/minute/peak-ccu?from=${iso(floor10(now) - 36e5)}&t=${t}`);
              iv = (j?.intervals || []).filter(e => e && typeof e.timestamp === 'string').sort((a, b) => a.timestamp < b.timestamp ? -1 : 1);
              const last = [...iv].reverse().find(e => num(e.value) != null);
              const nl = last ? { t: last.timestamp, ccu: last.value } : { t: iv.length ? iv[iv.length - 1].timestamp : at, ccu: null };
              if (live ? nl.ccu !== live.ccu : nl.ccu != null) events.push({ at, code: map.code, k: 'live', ccu: nl.ccu });
              live = nl;
            } catch (e) { console.log('direct', map.code, e.message); }

            const cutoff = +now - KEEP_DAYS * 864e5;
            byCode[map.code] = {
              hours: [...hours.values()].filter(h => +new Date(h.t) >= cutoff).sort((a, b) => a.t < b.t ? -1 : 1),
              live, checkedAt: at
            };

            const hr = hours.get(H.toISOString());
            const range = hm(H) + '–' + hm(+H + 36e5);
            let rev = null, est = false;
            if (hr && hr.m != null) rev = hr.m * RATE;
            else {
              const end = +H + 50 * 6e4;
              const vals = iv.filter(e => { const x = +new Date(e.timestamp); return x >= +H && x <= end && num(e.value) != null; }).map(e => e.value);
              if (vals.length) { rev = vals.reduce((s, v) => s + v, 0) / vals.length * 60 * RATE; est = true; }
            }
            const players = live && live.ccu != null ? '👥 ' + fmt(live.ccu) + ' connectés' : '👥 moins de 5 connectés';
            lines.push(rev != null
              ? `💰 ${name} · ${range} : ~${fmt(Math.round(rev * 100) / 100, 2)} $${est ? ' (estimé)' : ''} · ${players}`
              : `⏳ ${name} · ${range} : pas de données · ${players}`);
          }

          const seen = new Set();
          events = events
            .filter(e => e && e.at && e.code)
            .sort((a, b) => a.at < b.at ? 1 : -1)
            .filter(e => { const k = e.at + e.code + e.k + (e.t || ''); if (seen.has(k)) return false; seen.add(k); return true; })
            .slice(0, 200);

          writeFileSync('data.json', JSON.stringify({ updatedAt: at, maps, byCode, events }));
          console.log(lines.join('\n'));

          const secret = process.env.MYUEFN_PUSH;
          if (secret && lines.length) {
            try {
              const cfg = JSON.parse(secret);
              const webpush = (await import('web-push')).default;
              webpush.setVapidDetails('https://maxoumls.github.io/myuefn/', cfg.pub, cfg.priv);
              for (const s of Array.isArray(cfg.subs) ? cfg.subs : [cfg.sub]) {
                try {
                  await webpush.sendNotification(s, JSON.stringify({ title: 'MyUEFN', body: lines.join('\n') }), { TTL: 3600 });
                  console.log('Notification envoyée');
                } catch (e) { console.log('Notification refusée', e.statusCode || '', e.body || e.message); }
              }
            } catch (e) { console.log('Notification impossible :', e.message); }
          } else console.log('Pas de secret MYUEFN_PUSH : pas de notification.');
          EOF_SCRIPT
          node releve.mjs
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Relevé $(date -u +%H:%M) UTC"
          git pull --rebase
          git push
